[project]
name = "jaix"
# 소스 버전은 0.0.0+dev 다. 릴리스 빌드(jaix-setup.yml)가 jaix-kit 묶음 태그 값으로 바꿔 찍는다.
version = "0.0.0+dev"
description = "제주연구원 JAIX 도구 설치·점검·갱신 (setup · doctor · update)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jaix = "jaix.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaix"]

# 네트워크가 막혀도 doctor·setup이 돌게 잠금 사본을 패키지 안에 묶는다(lock.py가 마지막에 본다)
[tool.hatch.build.targets.wheel.force-include]
".claude-plugin/marketplace.json" = "jaix/marketplace.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
