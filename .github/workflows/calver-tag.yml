name: calver-tag

# 날짜 버전 태그(vYYYY.MM.DD.N, KST)를 지금 커밋에 단다. 사람이 번호를 관리하지 않는다.
# 도구 저장소는 아래처럼 불러 쓴다 (main 머지마다 태그 하나):
#
#   on: { push: { branches: [main] } }
#   concurrency: calver-tag
#   jobs:
#     tag:
#       uses: jeju-inst/jaix-kit/.github/workflows/calver-tag.yml@main
#       permissions: { contents: write }
#
# GITHUB_TOKEN 으로 단 태그는 다른 워크플로의 `push: tags` 를 깨우지 않는다.
# 태그로 빌드를 돌려야 하면 outputs.tag 를 받아 `gh workflow run` 으로 부른다.

on:
  workflow_call:
    outputs:
      tag:
        description: 단 태그(이미 날짜 태그가 있는 커밋이면 그 태그)
        value: ${{ jobs.tag.outputs.tag }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        shell: bash
        run: |
          re='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'
          have=$(git tag --points-at HEAD | grep -E "$re" | head -1 || true)
          if [ -n "$have" ]; then
            echo "이미 태그됨: $have"; echo "tag=$have" >> "$GITHUB_OUTPUT"; exit 0
          fi
          d=$(TZ=Asia/Seoul date +%Y.%m.%d)
          for attempt in 1 2 3 4 5; do
            git fetch -q --tags --force
            n=$(git tag -l "v$d.*" | sed "s/^v$d\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            tag="v$d.$(( ${n:-0} + 1 ))"
            git tag "$tag" HEAD
            if git push -q origin "refs/tags/$tag"; then
              echo "태그: $tag"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git tag -d "$tag"; sleep $(( attempt * 3 ))   # 같은 날 다른 머지와 번호가 부딪힘 → 다시
          done
          echo "::error::태그를 달지 못함"; exit 1
