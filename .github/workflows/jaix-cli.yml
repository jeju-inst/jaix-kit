name: jaix-cli

# jaix CLI(setup · doctor · update) 시험. 단위 시험은 세 OS, 실제 설치는 Windows 새 러너에서
# `jaix setup` → `jaix doctor` 까지 돌린다(관리자 권한 없이 사용자 범위로만 설치하는지 포함).

on:
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/jaix-cli.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/jaix-cli.yml"]
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows-setup:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # 런타임 릴리스 조회가 익명 한도에 걸리지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install jaix + Claude Code
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code
      - name: jaix setup (all runtimes, Claude channel)
        run: jaix setup --channels claude,codex --runtimes all --log setup.log
      - name: jaix doctor (new login — user PATH re-read from the registry)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          jaix doctor
          if ($LASTEXITCODE -ne 0) { throw "jaix doctor 실패" }
          jaix doctor --json > doctor.json
          # jaix-kit#14: 플러그인 MCP용 uv 관리 Python이 앱 밖 실제 경로(%APPDATA%\uv\python)에 있어야 한다
          $c = (Get-Content doctor.json -Raw | ConvertFrom-Json).checks | Where-Object area -eq 'uv 관리 Python'
          if ($c.status -ne 'ok') { throw "uv 관리 Python: $($c.status) $($c.message)" }
          Get-ChildItem "$env:APPDATA\uv\python"
      # 로그온 자동 갱신: 이 사용자로 못박은 예약 작업이 있고, 그 명령이 돌아 상태를 남기는지
      - name: Logon auto-update task
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $raw = schtasks /Query /TN jaix-update /XML | Out-String
          if ($LASTEXITCODE -ne 0) { throw "예약 작업 jaix-update 없음" }
          $task = ([xml]$raw).Task
          $exec = $task.Actions.Exec
          Write-Host "명령: $($exec.Command) $($exec.Arguments)"
          $pr = $task.Principals.Principal
          Write-Host "로그온 트리거 사용자: $($task.Triggers.LogonTrigger.UserId) · 실행: $($pr.LogonType) · 권한: $($pr.RunLevel)"
          # 스케줄러는 기본값 LeastPrivilege 를 지워서 돌려준다 → 비어 있으면 일반 권한
          if ($pr.RunLevel -and $pr.RunLevel -ne 'LeastPrivilege') { throw "관리자 권한으로 등록됨: $($pr.RunLevel)" }
          if ($pr.LogonType -ne 'InteractiveToken') { throw "'로그온할 때만 실행'이 아님: $($pr.LogonType)" }
          $jaix = Join-Path $env:LOCALAPPDATA 'Programs\jaix'
          $status = "$jaix\update-status.json"
          Remove-Item $status -ErrorAction SilentlyContinue
          schtasks /Run /TN jaix-update
          for ($i = 0; $i -lt 60 -and -not (Test-Path $status); $i++) { Start-Sleep 5 }
          if (-not (Test-Path $status)) {
            # 러너는 대화형 로그온이 아니라 InteractiveToken 작업이 안 돌 수 있다 → 등록된 명령을 그대로 실행
            Write-Warning "작업 스케줄러가 작업을 돌리지 않음 → 등록된 명령을 직접 실행"
            schtasks /Query /TN jaix-update /V /FO LIST
            Start-Process -FilePath $exec.Command.Trim('"') -ArgumentList $exec.Arguments -Wait -NoNewWindow
          }
          Get-Content "$jaix\update.log" -Tail 40
          $s = Get-Content $status -Raw | ConvertFrom-Json
          if (-not $s.ok) { throw "자동 갱신 실패: $($s.error) $($s.problems)" }
          jaix doctor
          # 실행 모드('로그온할 때만 실행'·일반 권한)와 마지막 결과까지 doctor가 통과로 보는지
          $c = (jaix doctor --json | Out-String | ConvertFrom-Json).checks | Where-Object area -eq '로그온 자동 갱신'
          Write-Host "doctor: $($c.status) $($c.message)"
          if ($c.status -ne 'ok') { throw "doctor 로그온 자동 갱신: $($c.status) $($c.message)" }
      # 러너엔 Git·uv가 이미 있어 위 setup은 포터블 경로를 안 탈 수 있다. 깨끗한 PC(winget 거절)에서 쓰는
      # 포터블 설치를 따로 돌려 압축 구조가 맞는지 본다
      - name: Portable installs (what a clean PC falls back to)
        shell: pwsh
        run: |
          $env:JAIX_HOME = "$env:RUNNER_TEMP\jaix-portable"
          $env:PYTHONIOENCODING = "utf-8"
          python -c "from jaix import runtimes as r; [r.install_portable(r.BY_KEY[k], print) for k in ('uv', 'git', 'age')]"
          & "$env:JAIX_HOME\bin\uv.exe" --version
          & "$env:JAIX_HOME\bin\uvx.exe" --version
          & "$env:JAIX_HOME\git\cmd\git.exe" --version
          & "$env:JAIX_HOME\bin\age.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "포터블 실행 실패" }
      - name: Second setup changes nothing
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8   # jaix는 UTF-8로 쓴다
          $out = jaix setup --channels claude --runtimes none | Out-String
          Write-Host $out
          if ($out -notmatch "이미 등록됨") { throw "두 번째 setup이 설정을 또 바꿈" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaix-setup-windows
          path: |
            setup.log
            doctor.json
