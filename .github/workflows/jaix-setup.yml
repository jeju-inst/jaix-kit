name: jaix-setup

# jaix\ (PyInstaller onedir: jaix.exe·jaixw.exe·_internal, installer/jaix.spec)와 설치 프로그램 jaix-setup.exe(Inno, 사용자 범위)를 만들고,
# 새 Windows 러너에서 무인 설치 → jaix doctor → 제거까지 시험한다.
# 묶음 태그(vYYYY.MM.DD.N)로 실행될 때만 버전을 찍고 그 태그의 릴리스로 올린다.
# bundle-tag.yml 이 태그를 단 뒤 `gh workflow run jaix-setup.yml --ref <tag>` 로 부른다
# (GITHUB_TOKEN 으로 단 태그는 push: tags 를 깨우지 않는다). PR·수동 실행은 빌드·시험만 하고 올리지 않는다.

on:
  workflow_dispatch:
  pull_request:
    paths: ["installer/**", "src/**", "pyproject.toml", ".github/workflows/jaix-setup.yml"]

permissions:
  contents: write

# 태그 빌드는 한 줄로 세운다(릴리스 생성이 겹치지 않게). PR·브랜치 빌드는 따로라 태그 빌드를 밀어내지 않는다.
concurrency:
  group: jaix-setup-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}   # 런타임 릴리스 조회가 익명 한도에 걸리지 않게
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 소스 버전은 0.0.0+dev 다. 태그로 빌드할 때만 태그 값(v 뗀 것, 예 2026.10.27.1 —
      # PEP 440·Inno 4자리 모두 유효)을 찍어 jaix --version 과 설치본이 묶음 번호를 말하게 한다.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Stamp($path, $pattern, $repl, $bom = $false) {
            $text = [IO.File]::ReadAllText($path)
            $new = [regex]::Replace($text, $pattern, $repl, 'Multiline')
            if ($new -eq $text) { throw "버전 자리를 못 찾음: $path" }
            [IO.File]::WriteAllText($path, $new, (New-Object System.Text.UTF8Encoding($bom)))
          }
          Stamp pyproject.toml '^version = ".*"' "version = `"$v`""
          Stamp src/jaix/__init__.py '^__version__ = ".*"' "__version__ = `"$v`""
          Stamp installer/jaix-setup.iss '^#define AppVer ".*"' "#define AppVer `"$v`"" $true
          Write-Host "version $v"

      # onedir(jaix-kit#46): onefile 이 Defender 기계학습 판정에 걸려 바꿨다. UPX 끔·버전 리소스는 spec 에서
      - name: Build jaix (onedir)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          if ("${{ github.ref }}".StartsWith('refs/tags/v')) { $env:JAIX_VERSION = "${{ github.ref_name }}".Substring(1) }
          pyinstaller --noconfirm installer\jaix.spec
          .\dist\jaix\jaix.exe --version
          $p = Start-Process dist\jaix\jaixw.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "jaixw.exe --version 종료 코드 $($p.ExitCode)" }
          if (Test-Path dist\jaix.exe) { throw "onefile jaix.exe 가 생김" }
          foreach ($exe in 'jaix.exe','jaixw.exe') {
            $vi = (Get-Item "dist\jaix\$exe").VersionInfo
            Write-Host "$exe : $($vi.CompanyName) · $($vi.ProductName) · $($vi.FileVersion) · $($vi.ProductVersion)"
            if ($vi.CompanyName -ne '제주연구원' -or $vi.ProductName -ne 'JAIX' -or -not $vi.FileVersion) { throw "$exe 버전 리소스 없음" }
          }
          # UPX 를 안 썼는지(UPX 로 싼 파일엔 UPX! 표식이 남는다)
          $upx = Get-ChildItem -Recurse dist\jaix -Include *.exe,*.dll,*.pyd | Where-Object { Select-String -Path $_.FullName -Pattern 'UPX!' -SimpleMatch -Quiet }
          if ($upx) { throw "UPX 로 싼 파일: $($upx.Name -join ', ')" }

      # 코드 서명 자리(jaix-kit#46). 인증서가 생기면 시크릿을 넣고 이 단계를 켠다. 순서: 이 단계에서
      # dist\jaix\jaix.exe·jaixw.exe 를 서명 → 설치본을 만든 뒤 installer\Output\jaix-setup.exe 도 서명(아래 Build installer 끝).
      # Inno 의 [Setup] SignTool= 로 제거기(unins000.exe)까지 서명하려면 ISCC 에 /S 로 도구를 넘긴다.
      - name: Sign binaries (자리만 — 인증서 준비 뒤 켬)
        if: ${{ false }}
        shell: pwsh
        run: |
          # signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f cert.pfx /p $env:SIGN_PASSWORD dist\jaix\jaix.exe dist\jaix\jaixw.exe
          throw "서명 단계 미구현"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\payload | Out-Null
          Copy-Item -Recurse dist\jaix installer\payload\jaix
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\jaix-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패 $LASTEXITCODE" }
          Get-ChildItem installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: jaix-windows
          path: |
            dist/jaix/
            installer/Output/jaix-setup.exe

      # --- 새 러너에서 설치 → 점검 → 제거 (인수 시험 0-1·0-3을 CI에서 흉내) ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code (so setup can install plugins right away)
        run: npm install -g @anthropic-ai/claude-code

      # /GWSOURCE=none: 실제 원내 배포 서버(IP 제한)를 CI 에서 부르지 않는다. 설치본의 jaix setup 은 작업 스케줄러로
      # 돌 수 있어 환경변수가 안 넘어가므로 설정값(config.json)으로 끈다
      - name: Silent install (per-user, no admin)
        shell: pwsh
        run: |
          # 예전(onefile) 설치본 흉내: {app} 바로 아래 실행파일과 그 PATH 항목. 덮어 설치가 둘 다 정리해야 한다
          $app = Join-Path $env:LOCALAPPDATA 'Programs\jaix'
          New-Item -ItemType Directory -Force $app | Out-Null
          Set-Content "$app\jaix.exe" 'old' ; Set-Content "$app\jaixw.exe" 'old'
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', "$user;$app", 'User')
          $p = Start-Process installer\Output\jaix-setup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log','/CHANNELS=claude,codex','/GWSOURCE=none'
          Get-Content install.log -Tail 60
          if ($p.ExitCode -ne 0) { throw "설치 종료 코드 $($p.ExitCode)" }
          foreach ($f in 'jaix\jaix.exe','jaix\jaixw.exe','jaix\_internal') {
            if (-not (Test-Path "$app\$f")) { throw "$f 가 $app 에 없음" }
          }
          foreach ($f in 'jaix.exe','jaixw.exe') {
            if (Test-Path "$app\$f") { throw "예전 설치본의 $f 가 $app 에 남음" }
          }
          $entries = [Environment]::GetEnvironmentVariable('Path', 'User').Split(';') | ForEach-Object { $_.TrimEnd('\') }
          if ($entries -contains $app) { throw "예전 PATH 항목 $app 이 남음" }
          if ($entries -notcontains "$app\jaix") { throw "PATH 에 $app\jaix 가 없음" }
          $data = Join-Path $env:LOCALAPPDATA 'jaix'   # 기록·상태는 데이터 폴더(프로그램 폴더와 나눔)
          Get-Content "$data\setup.log"
          # #27: jaix setup 본 실행이 작업 스케줄러(--via-task)로 돌았는지 — 그 길만 setup-status.json 을 남긴다
          if (-not (Test-Path "$data\setup-status.json")) { throw "jaix setup 이 작업 스케줄러로 돌지 않음(setup-status.json 없음)" }
          Get-Content "$data\setup-status.json"
          foreach ($f in 'setup.log','setup-status.json','guide.txt') {
            if (Test-Path "$app\$f") { throw "기록 $f 이 프로그램 폴더에 생김" }
          }
          schtasks /Query /TN jaix-setup-once 2>$null
          if ($LASTEXITCODE -eq 0) { throw "한 번짜리 작업 jaix-setup-once 가 남음" }
          $global:LASTEXITCODE = 0
          Get-Content "$data\guide.txt"

      - name: jaix doctor (from the user PATH the installer wrote)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          # 새 로그인처럼 사용자 PATH를 레지스트리에서 다시 읽는다
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:Path = "$user;$machine"
          $src = (Get-Command jaix).Source
          Write-Host $src
          if ($src -notlike '*\Programs\jaix\jaix\jaix.exe') { throw "PATH 의 jaix 가 onedir 폴더 것이 아님: $src" }
          jaix --version
          jaix doctor
          if ($LASTEXITCODE -ne 0) { throw "jaix doctor 실패" }
          (Get-Command hwp2pdf-cli).Source
          Get-ChildItem "$env:APPDATA\uv\python"   # jaix-kit#14: 설치본이 uv 관리 Python을 앱 밖에서 깔았는지
          # 명령창 claude·codex(사용자 요구 11/5): 새 창에서 바로 되는지 — PowerShell 과 cmd 둘 다
          Get-Content "$env:LOCALAPPDATA\jaix\cli-installed.json" -ErrorAction SilentlyContinue
          foreach ($n in 'claude','codex') {
            $c = Get-Command $n -ErrorAction SilentlyContinue
            if (-not $c) { throw "새 PowerShell 에서 $n 이 안 잡힘" }
            Write-Host "$n -> $($c.Source)"
            & $n --version
            if ($LASTEXITCODE -ne 0) { throw "$n --version 종료 코드 $LASTEXITCODE" }
            cmd /c "$n --version"
            if ($LASTEXITCODE -ne 0) { throw "cmd 에서 $n --version 종료 코드 $LASTEXITCODE" }
          }

      # 로그온 자동 갱신: 설치기가 둔 시작프로그램 바로가기(jaixw.exe update --quiet)가 있고, 예약 작업은 만들지 않으며
      # (Defender Persistence.A!ml, jaix-win 11/4), 그 명령이 돌아 상태를 남기는지
      - name: Logon auto-update shortcut
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'JAIX 갱신.lnk'
          if (-not (Test-Path $lnk)) { Get-ChildItem ([Environment]::GetFolderPath('Startup')); throw "시작프로그램 바로가기 없음: $lnk" }
          # WScript.Shell 은 한글 이름 .lnk 를 빈 바로가기로 읽는다(러너 코드페이지 1252) → ASCII 이름 사본으로 읽는다
          $copy = Join-Path $env:TEMP 'jaix-startup-check.lnk'
          Copy-Item -LiteralPath $lnk -Destination $copy -Force
          Write-Host "바로가기 파일: $((Get-Item -LiteralPath $lnk).Length) B"
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($copy)
          Write-Host "바로가기: $($sc.TargetPath) $($sc.Arguments)"
          if ($sc.TargetPath -notlike '*\jaix\jaixw.exe') { throw "바로가기가 창 없는 jaixw.exe 를 부르지 않음: $($sc.TargetPath)" }
          if ($sc.Arguments -notlike 'update --quiet*') { throw "바로가기 인자: $($sc.Arguments)" }
          schtasks /Query /TN jaix-update 2>$null
          if ($LASTEXITCODE -eq 0) { throw "설치본이 예약 작업 jaix-update 를 만듦(지속성 판정 대상)" }
          $global:LASTEXITCODE = 0
          $jaix = Join-Path $env:LOCALAPPDATA 'jaix'
          $status = "$jaix\update-status.json"
          Remove-Item $status -ErrorAction SilentlyContinue
          # 로그온 때 셸이 여는 것과 같은 명령(지연만 빼고)
          Start-Process -FilePath $sc.TargetPath -ArgumentList 'update','--quiet' -Wait -NoNewWindow
          Get-Content "$jaix\update.log" -Tail 40
          $s = Get-Content $status -Raw | ConvertFrom-Json
          if (-not $s.ok) { throw "자동 갱신 실패: $($s.error) $($s.problems)" }
          $c = (jaix doctor --json | Out-String | ConvertFrom-Json).checks | Where-Object area -eq '로그온 자동 갱신'
          Write-Host "doctor: $($c.status) $($c.message)"
          if ($c.status -ne 'ok') { throw "doctor 로그온 자동 갱신: $($c.status) $($c.message)" }

      # Claude Code 네이티브 설치 경로(clis.install_claude: downloads.claude.ai → manifest sha256 → claude.exe install
      # stable)는 러너에 npm 판 claude 가 이미 있어 위 설치에서는 '그대로 둠'만 탄다. 격리한 홈(USERPROFILE)에서 jaix 의
      # 같은 코드로 새로 깔고, 러너의 claude 를 PATH 에서 뺀 새 PowerShell·cmd 에서 잡히는지 본다(사용자 요구 11/5)
      - name: Claude Code native install (isolated home, runner claude hidden)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $home2 = Join-Path $env:RUNNER_TEMP 'cleanhome'
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:USERPROFILE = $home2; $env:HOME = $home2
          $env:JAIX_DATA = Join-Path $env:RUNNER_TEMP 'cleandata'
          @'
          import sys
          from jaix import clis
          clis.find_installed = lambda name: (None, None)  # 러너의 npm claude 는 없는 것으로
          res = clis.ensure("claude", print)
          print(res)
          print(open(clis.record_file(), encoding="utf-8").read())
          sys.exit(0 if res["status"] == "installed" else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "네이티브 설치 실패" }
          $bin = Join-Path $home2 '.local\bin'
          if (-not (Test-Path (Join-Path $bin 'claude.exe'))) { throw "런처 없음: $bin\claude.exe" }
          # 새 창처럼: 레지스트리의 사용자+시스템 PATH 를 다시 읽고, 러너의 npm claude 폴더는 뺀다
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:Path = (("$user;$machine" -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'claude.cmd')) -and -not (Test-Path (Join-Path $_ 'claude.ps1')) }) -join ';'
          $c = Get-Command claude -ErrorAction SilentlyContinue
          if (-not $c) { throw "새 PowerShell 에서 claude 가 안 잡힘(사용자 PATH 에 $bin 이 없음?)" }
          Write-Host "claude -> $($c.Source)"
          if ($c.Source -notlike "$bin*") { throw "다른 claude 가 잡힘: $($c.Source)" }
          & claude --version
          if ($LASTEXITCODE -ne 0) { throw "claude --version 종료 코드 $LASTEXITCODE" }
          cmd /c "claude --version"
          if ($LASTEXITCODE -ne 0) { throw "cmd 에서 claude --version 종료 코드 $LASTEXITCODE" }

      - name: Uninstall
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\jaix'
          $p = Start-Process "$app\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          # 제거기는 임시 사본으로 다시 떠서 끝나므로 폴더가 사라질 때까지 잠깐 기다린다
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Select-Object -First 20; throw "$app 가 남음" }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($user -like "*Programs\jaix*") { throw "사용자 PATH에 jaix가 남음: $user" }
          schtasks /Query /TN jaix-update 2>$null
          if ($LASTEXITCODE -eq 0) { throw "예약 작업 jaix-update 가 남음" }
          $global:LASTEXITCODE = 0   # 없어서 난 1이 단계 결과가 되지 않게
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'JAIX 갱신.lnk'
          if (Test-Path $lnk) { throw "시작프로그램 바로가기가 남음: $lnk" }
          Write-Host "제거 확인"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaix-install-logs
          path: install.log

      # 태그 빌드만 올린다. PR·브랜치 빌드는 0.0.0+dev 라 위 아티팩트에서 멈춘다.
      - name: Publish release for the bundle tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release delete $tag --yes 2>$null
          Compress-Archive -Path dist\jaix -DestinationPath jaix-windows.zip -Force
          gh release create $tag ".\installer\Output\jaix-setup.exe" ".\jaix-windows.zip" --latest `
            --title "JAIX $tag" `
            --notes "연구원 PC 설치: **jaix-setup.exe** 를 받아 실행하세요(관리자 권한 필요 없음).`n- jaix-setup.exe — 설치 프로그램. 런타임(uv·Git·Java·hwp2pdf)과 Claude·Codex 도구 등록까지 한 번에.`n- jaix-windows.zip — 같은 CLI(jaix setup · doctor · update)를 설치 없이 쓰는 폴더. 풀어서 jaix\jaix.exe 를 실행.`n고정 주소: https://github.com/jeju-inst/jaix-kit/releases/latest/download/jaix-setup.exe`nBuilt by .github/workflows/jaix-setup.yml."
